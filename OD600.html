TRqCwhGjpwqNAeBwPAuKB88TCkiGTpReE8uk1Upw3JKrJXCdXXqr+TWSkf/+ayyyGTWWWzyZQwMGEdDI1aWX5ZLP//8jUMDBx0MmVpZfI/I1ZQwUECDiB1ZQwMGh/qwUGCdDJlDBgaORqwOo5GX8/yYKClRy//M//NIxP4iK6YkFHoGtZlYGCjkasFBAwcvxQwMGEdDJlDVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NIxPgiHBV0AEgHQFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV",cI=T?gI("data:audio/mpeg;base64,"+T):"",JI=[{speaker:"Alan",text:"When we want to know how many bacteria are in a liquid, we often measure its optical density at 600 nanometers, or OD600.",timestamp:0,duration:8.856},{speaker:"Emily",text:"That tells us how cloudy the liquid is, right?",timestamp:8.856,duration:3.276},{speaker:"Alan",text:"Exactly. But that number alone doesn't tell us how many living cells are actually there.",timestamp:12.132,duration:5.436},{speaker:"Alan",text:"To translate that cloudiness into a real biological number, like colony-forming units per milliliter, we have to build a standard curve.",timestamp:17.567999999999998,duration:8.532},{speaker:"Alan",text:"We start by growing the bacteria on an agar plate.",timestamp:26.099999999999998,duration:3.888},{speaker:"Emily",text:"Why start with a plate instead of a liquid broth?",timestamp:29.988,duration:3.744},{speaker:"Alan",text:"Cells from a fresh plate are metabolically uniform and actively growing.",timestamp:33.732,duration:4.968},{speaker:"Alan",text:"Plus, we can visually check that our colonies are pure before we begin.",timestamp:38.7,duration:4.68},{speaker:"Alan",text:"We harvest about 10 to 20 well-isolated colonies and suspend them in a sterile diluent.",timestamp:43.38,duration:5.94},{speaker:"Alan",text:"This creates our primary suspension, which is the starting point for our curve.",timestamp:49.32,duration:5.076},{speaker:"Emily",text:"So we have one dense tube of bacteria. What's next?",timestamp:54.396,duration:4.176},{speaker:"Alan",text:"We need to find the linear range of our spectrophotometer.",timestamp:58.572,duration:4.032},{speaker:"Alan",text:"To do that, we create a two-fold dilution series from our primary suspension.",timestamp:62.604,duration:4.86},{speaker:"Alan",text:"This gives us a gradient of concentrations, from dense down to very dilute.",timestamp:67.464,duration:4.932},{speaker:"Emily",text:"And we measure the OD600 for every tube in that series?",timestamp:72.396,duration:4.392},{speaker:"Alan",text:"Yes, but we also need to know the actual number of living cells in each tube.",timestamp:76.788,duration:4.896},{speaker:"Alan",text:"So for each dilution, we take two paired measurements.",timestamp:81.684,duration:3.96},{speaker:"Alan",text:"We read the optical density to measure light scatter.",timestamp:85.64399999999999,duration:3.888},{speaker:"Alan",text:"And in parallel, we plate a sample to get a viable colony count.",timestamp:89.532,duration:4.032},{speaker:"Emily",text:"Light scatter versus actual living cells.",timestamp:93.564,duration:3.42},{speaker:"Alan",text:"Precisely. Now we plot those paired numbers on a graph.",timestamp:96.984,duration:3.456},{speaker:"Alan",text:"We put OD600 on the X-axis and the colony-forming units on the Y-axis.",timestamp:100.44,duration:6.084},{speaker:"Alan",text:"This creates our standard curve.",timestamp:106.524,duration:2.52},{speaker:"Alan",text:"We draw a straight line of best fit through the data points.",timestamp:109.044,duration:3.744},{speaker:"Emily",text:"Do all the points fit on that straight line?",timestamp:112.788,duration:3.384},{speaker:"Alan",text:"No. The linear relationship is only valid within a certain range.",timestamp:116.172,duration:4.716},{speaker:"Alan",text:"Below about 0.05, the signal gets lost in the instrument's background noise.",timestamp:120.88799999999999,duration:5.688},{speaker:"Alan",text:"And above 0.6 or 0.8, the light scatters too much, and the relationship becomes non-linear.",timestamp:126.576,duration:6.768},{speaker:"Alan",text:"So we only use the linear portion of the curve to calculate our cell concentrations.",timestamp:133.344,duration:5.04},{speaker:"Emily",text:"So to recap: we harvest pure colonies, make a dilution series, measure OD600 and viable counts together, and plot the linear range.",timestamp:138.384,duration:10.404},{speaker:"Alan",text:"That's it. Why is it important to measure the OD600 and plate the viable counts from the exact same tube at the same time?",timestamp:148.78799999999998,duration:7.56}],pI="english",YI=document.getElementById("root"),f=II(YI);try{f.render(c.createElement(sI,{audioSrc:cI,segments:JI,language:pI}))}catch(q){f.render(c.createElement("div",{style:{padding:"20px",color:"#1d1d1f",fontFamily:"monospace",background:"rgba(255,255,255,0.95)",borderRadius:"10px",maxWidth:"600px"}},c.createElement("h3",{style:{color:"#ff3b30"}},"Error rendering component"),c.createElement("pre",null,q.message)))}
